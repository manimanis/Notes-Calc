<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calculatrice</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/icon-192.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calc Notes">

  <meta name="description" content="Calculatrice de notes pour examens">

  <meta name="theme-color" content="#312e81">
</head>

<body>
  <nav class="toolbar" aria-label="Actions">
    <button id="butInstall" type="button" aria-label="Installer l'application" hidden></button>
    <button id="btn-settings" type="button" aria-label="Paramètres"></button>
  </nav>

  <div id="app" v-on:keyup.left="moveLeft()" v-on:keyup.right="moveRight()">
    <div id="list" ondrop="dropHandlerMoveLast(event)" ondragover="dragoverHandler(event)">
      <div class="item" v-bind:id="'item-' + idx" v-bind:class="{'selected': selectedNote == idx}" tabindex="0"
        v-for="(note, idx) in listNotes" v-on:click="selectNote(idx)" draggable="true"
        ondragstart="dragstartHandler(event)" ondragend="dragendHandler(event)"
        ondragover="dragoverHandler(event)" ondrop="dropHandlerMoveBefore(event)"
        ontouchstart="touchDragStart(event)" ontouchend="touchDragEnd(event)"
        ontouchcancel="touchDragEnd(event)">
        <span>{{idx+1}}</span>{{note.getVal().toFixed(2)}}
      </div>
    </div>
    <div id="total">
      <div v-if="examBareme !== finalBareme">
        <div class="title">Barème sur {{examBareme}}</div>
        <div id="runningTotal">{{runningTotal.toFixed(2)}}</div>
      </div>
      <div>
        <div class="title">Note Finale</div>
        <div id="finalTotal">{{finalTotal.toFixed(2)}}</div>
      </div>

      <button id="btn-trash" type="button" v-bind:disabled="listNotes.length == 0" v-on:click="resetCalc()"
        title="Glisser une note ici pour la supprimer · Clic pour tout effacer"
        ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"
        ondragenter="trashDragEnterHandler(event)" ondragleave="trashDragLeaveHandler(event)">🗑</button>
    </div>
    <div id="control">
      <button id="num" v-on:click="appendNumber()"
        v-bind:disabled="currNum.getVal() == 0.0">{{currNum.getVal().toFixed(2)}}</button>
      <div id="int">
        <button v-for="n in 5" v-bind:id="'int-' + (n - 1)" v-on:click="currNum.setInteger(selValue + n - 1)">{{selValue
          + n - 1}}</button>
      </div>
      <div id="frac">
        <button id="p0-4" data-value="0" v-on:click="currNum.setDecimal(0)">0</button>
        <button id="p1-4" data-value="25" v-on:click="currNum.setDecimal(25)">¼</button>
        <button id="p1-2" data-value="50" v-on:click="currNum.setDecimal(50)">½</button>
        <button id="p3-4" data-value="75" v-on:click="currNum.setDecimal(75)">¾</button>
      </div>
      <div id="base">
        <button v-for="n in 5" v-bind:class="{'is-active': selValue === (n - 1) * 5}"
          v-on:click="setBaseValue((n - 1) * 5)">{{(n - 1) * 5}}</button>
      </div>
    </div>

    <div class="settings-overlay" v-if="showSettings" v-on:click.self="closeSettings()"
      role="presentation">
      <div class="settings-panel" role="dialog" aria-labelledby="settings-title" aria-modal="true">
        <h2 id="settings-title">Configuration</h2>
        <form class="settings-form" v-on:submit.prevent="closeSettings()">
          <fieldset class="settings-presets">
            <legend>Notes</legend>
            <div class="settings-preset-group" role="group" aria-label="Barèmes prédéfinis">
              <button type="button" class="settings-preset-btn" v-for="preset in notePresets"
                v-bind:key="preset.label"
                v-bind:class="{'is-active': isNotePresetActive(preset)}"
                v-on:click="applyNotePreset(preset)">{{preset.label}}</button>
            </div>
          </fieldset>
          <label class="settings-field" for="exam-bareme">
            <span class="settings-field-label">Barème de l'examen <strong>Sur {{examBareme}}</strong></span>
            <input type="range" id="exam-bareme" class="settings-range" min="5" max="100" step="1"
              v-model.number="examBareme" v-on:input="updateTotal()"
              v-bind:aria-valuenow="examBareme" aria-valuemin="5" aria-valuemax="100">
          </label>
          <label class="settings-field" for="final-bareme">
            <span class="settings-field-label">Barème de la note finale <strong>Sur {{finalBareme}}</strong></span>
            <input type="range" id="final-bareme" class="settings-range" min="5" max="100" step="1"
              v-model.number="finalBareme" v-on:input="updateTotal()"
              v-bind:aria-valuenow="finalBareme" aria-valuemin="5" aria-valuemax="100">
          </label>
          <fieldset class="settings-presets">
            <legend>Arrondissement</legend>
            <div class="settings-preset-group settings-preset-group--rounding" role="group"
              aria-label="Modes d'arrondissement prédéfinis">
              <button type="button" class="settings-preset-btn" v-for="preset in roundingPresets"
                v-bind:key="preset.mode"
                v-bind:class="{'is-active': isRoundingPresetActive(preset.mode)}"
                v-on:click="applyRoundingPreset(preset.mode)">{{preset.label}}</button>
            </div>
          </fieldset>
          <div class="settings-actions">
            <button type="submit" class="settings-btn-primary">Fermer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="scripts/install.js"></script>
  <script src="scripts/vue.min.js"></script>
  <script src="scripts/control.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then((reg) => {
            console.log('Service worker registered.', reg);
          });
      });
    }
  </script>
</body>

</html>
